name: clickhouse-vm

# Three-machine ClickHouse quorum test. It is not part of nix-checks:
# that job must not download or build the ClickHouse closure.
on:
  pull_request:
    paths:
      - "modules/kcore-clickhouse.nix"
      - "tests/clickhouse-module.nix"
      - ".github/workflows/clickhouse-vm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clickhouse-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        continue-on-error: true

      - name: Run the three-machine ClickHouse test
        run: nix build --extra-experimental-features 'nix-command flakes' --file tests/clickhouse-module.nix
