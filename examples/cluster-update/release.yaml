# A hand-written ClusterUpdate. Releases do not ship one: `kctl update version
# set vX.Y.Z` rolls the cluster to a tag. Submit this with:
#   kctl update cluster apply -f release.yaml
kind: ClusterUpdate
metadata:
  name: release-0-3-0
spec:
  target:
    version: "0.3.0"
    flakeRef: github:kcorehypervisor/kcore
    flakeRev: "0123456789abcdef0123456789abcdef01234567"
  selector:
    allNodes: true
  strategy:
    strategyType: canary
    maxUnavailable: 1
    canarySoakSeconds: 3600
  drainVms: false
  activation:
    mode: auto
  approvalPolicy: manual
  updateKind: kcore
