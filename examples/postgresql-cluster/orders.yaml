# A PostgreSQL cluster: one primary and two streaming standbys on three
# kcoreOS nodes. Each node also runs an etcd voter; Patroni uses etcd to elect
# the leader and fails over without the controller.
#
# Lab target (three Dells): examples/postgresql-cluster/dell-lab.yaml
#
#   kctl pg-cluster plan -f examples/postgresql-cluster/orders.yaml
#   kctl pg-cluster apply -f examples/postgresql-cluster/orders.yaml --confirm
#   kctl pg-cluster health orders
#   kctl pg-cluster credentials orders
#
# Writes go to the VIP (held only by the Patroni leader); reads use the
# reader URI from `credentials`, which spreads over the standbys.
# See docs/bare-metal-postgresql.md.
kind: PostgresqlCluster
metadata:
  name: orders
spec:
  package: postgresql_17
  members:
    - nodeId: node-105
      role: primary
      advertiseAddress: 192.168.40.105
      iface: enp6s0
      dataVolume: { name: pg-orders, storageClass: lvm, volumeGroup: vg_kcore, sizeBytes: 214748364800, fsType: xfs }
    - nodeId: node-106
      advertiseAddress: 192.168.40.106
      iface: enp6s0
      dataVolume: { name: pg-orders, storageClass: lvm, volumeGroup: vg_kcore, sizeBytes: 214748364800, fsType: xfs }
    - nodeId: node-108
      advertiseAddress: 192.168.40.108
      iface: enp6s0
      dataVolume: { name: pg-orders, storageClass: lvm, volumeGroup: vg_kcore, sizeBytes: 214748364800, fsType: xfs }
  replication:
    mode: quorum
  vip:
    address: 192.168.40.150/24
    virtualRouterId: 61
  clientNetworks: [192.168.40.0/24]
  parameters:
    max_connections: "300"
    work_mem: "16MB"
  roles:
    - name: app
      login: true
  databases:
    - name: orders
      owner: app
      extensions: [pg_stat_statements, pgcrypto]
