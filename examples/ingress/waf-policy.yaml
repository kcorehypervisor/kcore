# OWASP Core Rule Set through Coraza. Start in detect mode: the engine only
# logs, so you can see what would be blocked before it is.
#
#   kctl apply -f examples/ingress/waf-policy.yaml
kind: WafPolicy
metadata:
  name: crs-default
spec:
  engine: detect
  crs:
    paranoiaLevel: 1
    inboundAnomalyThreshold: 5
    outboundAnomalyThreshold: 4
    allowedMethods: [GET, HEAD, POST, OPTIONS, PUT, PATCH, DELETE]
    allowedContentTypes:
      - application/json
      - application/x-www-form-urlencoded
      - multipart/form-data
  requestBodyLimitBytes: 1048576
  responseBodyInspection: false
