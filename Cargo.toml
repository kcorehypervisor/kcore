[workspace]
members = [
    "crates/kcore-gpu",
    "crates/kcore-sanitize",
    "crates/kcore-disko-types",
    "crates/kcore-verification",
    "crates/kcore-disk-layout-yaml",
    "crates/kcore-console",
    "crates/kcore-disk-verify",
    "crates/kcore-volume-mirror",
    "crates/node-agent",
    "crates/controller",
    "crates/kctl",
]
resolver = "2"

# Declare `cfg(kani)` so rustc does not emit `unexpected_cfgs` warnings for
# Kani proof modules (`#[cfg(kani)]`) when building under stable rustc.
# Kani's own toolchain sets the cfg automatically when running `cargo kani`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
