}

message FenceVolumeRequest {
  // pool/image
  string backend_handle = 1;
  // Every address the lost node may show up under in `rbd status`: its Ceph
  // public address and the host part of its gRPC address. A watcher from any
  // other host makes the call fail.
  repeated string source_hosts = 2;
}

message FenceVolumeResponse {
  // Entity addresses (`ip:port/nonce`) that were added to the OSD blocklist,
  // plus `range:<ip>/32` entries for the lost host. Empty when nobody had
  // the image open and no range was added.
  repeated string blocklisted = 1;
  // dead: the lost host has no Ceph clients. isolated: it still has the
  // image open. unknown: the member could not tell.
  string host_state = 2;
}

