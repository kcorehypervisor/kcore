  repeated string source_hosts = 2;
  // pool/image handles whose watchers count as proof the host is still writing.
  repeated string images = 3;
}

message ProbeHostStorageResponse {
  // False when Ceph did not answer. The controller must not fence then.
  bool queried = 1;
  // up, down, absent, or unknown.
  string osd_state = 2;
  bool watcher_from_host = 3;
  string detail = 4;
}

