  // and accepted by GetNixApplyStatus. Empty means the node picks its own.
  string apply_id = 3;
}

message ApplyNixConfigResponse {
  bool success = 1;
  string message = 2;

  // Token to poll with GetNixApplyStatus. Empty when the node agent predates
  // apply tracking, in which case callers must not wait for activation.
  string apply_id = 3;
}

enum NixApplyPhase {
  NIX_APPLY_PHASE_UNSPECIFIED = 0;
  // Rebuild is still running (or queued behind another apply).
  NIX_APPLY_PHASE_RUNNING = 1;
  // `nixos-rebuild test && nixos-rebuild switch` activated successfully.
  NIX_APPLY_PHASE_SUCCEEDED = 2;
  NIX_APPLY_PHASE_FAILED = 3;
  // The node has no record of this apply_id (agent restart, or a newer apply
  // superseded it).
  NIX_APPLY_PHASE_UNKNOWN = 4;
}

