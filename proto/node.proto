  LiveMigrateReceiveState observed = 3;
}

message GetLiveMigrateReceiveStatusRequest {
  string vm_name = 1;
}

// Everything the node can observe about a receive session without touching it.
message LiveMigrateReceiveState {
  // A prepare ran here and the session is still tracked in memory. This is
  // what makes a retried PrepareLiveMigrateReceive answer ALREADY_EXISTS.
  bool has_session = 1;
  // Migration port the session holds; 0 when there is no in-memory session.
  int32 port = 2;
  // Receive-mode cloud-hypervisor pid from the in-memory session, 0 if none.
  uint32 session_pid = 3;
  // Pid recorded in <socket_dir>/<vm>.migrate.pid, 0 when the file is absent.
  // Survives a node-agent restart, so it can be set while has_session is not.
  uint32 pid_file_pid = 4;
  // Whether that pid is a live process. The decisive field: false means
  // nothing is receiving and the session is safe to clear.
  bool vmm_alive = 5;
  // Whether the live pid really is this VM's receive VMM, checked against its
  // /proc cmdline. False with vmm_alive true means the pid was recycled and
  // clearing must not kill it.
  bool vmm_pid_matches_vm = 6;
  // Whether any process holds a listening socket on `port`.
  bool port_listening = 7;
  bool pid_file_present = 8;
  // <socket_dir>/<vm>.live-migrated: the receive completed and the generated
  // unit should adopt the running VMM rather than cold-start one.
  bool marker_present = 9;
  bool api_socket_present = 10;
  // One-line operator-facing reading of the fields above.
  string summary = 11;
}

message GetLiveMigrateReceiveStatusResponse {
  bool success = 1;
  string message = 2;
  LiveMigrateReceiveState state = 3;
}

message GetLiveMigrateProgressRequest {
  string vm_name = 1;
}

message GetLiveMigrateProgressResponse {
  bool success = 1;
  string message = 2;
  LiveMigrateReceiveState state = 3;
  // Always true for this estimate path — CH has no reliable byte counter.
  bool estimate = 4;
  int64 elapsed_seconds = 5;
  int64 memory_bytes = 6;
}

message SendLiveMigrateRequest {
  string vm_name = 1;
  // tcp:<dest-ip>:<port>
  string destination_url = 2;
  int32 timeout_seconds = 3;
}

message SendLiveMigrateResponse {
  bool success = 1;
  string message = 2;
}

message FinalizeLiveMigrateSourceRequest {
  string vm_name = 1;
  string rbd_pool = 2;
  string rbd_image = 3;
  repeated RbdImageRef rbd_volumes = 4;
}

message FinalizeLiveMigrateSourceResponse {
  bool success = 1;
  string message = 2;
  // Verified (not merely requested) post-conditions. The controller refuses to
  // start the VM on the destination unless both are true, so a cold move can
  // never have two VMMs writing the same RBD image.
  bool vmm_stopped = 3;
  bool rbd_unmapped = 4;
}

message FinalizeLiveMigrateDestRequest {
  string vm_name = 1;
}

message FinalizeLiveMigrateDestResponse {
  bool success = 1;
  string message = 2;
}


message RotateNodeCertRequest {
  // Rotate even when the certificate is not yet inside the renewal window.
  bool force = 1;
  // Correlation id for controller-driven rotations (audit/log only).
  string reason = 2;
}

message RotateNodeCertResponse {
  bool success = 1;
  string message = 2;
  // Serial of the newly installed certificate, empty when no rotation happened.
  string serial_hex = 3;
  // True when the certificate was already outside the renewal window and
  // force was not set, so nothing was changed.
  bool skipped = 4;
  int32 days_until_expiry = 5;
}

message HotAddDiskRequest {
  string vm_name = 1;
  // Absolute host path (mapped RBD or /dev/mapper/…).
  string path = 2;
  string serial = 3;
  bool readonly = 4;
}

message HotAddDiskResponse {
  bool success = 1;
  string message = 2;
}

message HotRemoveDiskRequest {
  string vm_name = 1;
  // Virtio device id / serial used at add time.
  string disk_id = 2;
}

message HotRemoveDiskResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// Kubernetes Node Configuration
// ============================================================================

message CiliumConfig {
  string mode = 1;
  int32 mtu = 2;
  string tunnel = 3;
  bool auto_direct_node_routes = 4;
  bool nat_outgoing = 5;
  repeated string load_balancer_ip_pools = 6;
}

message ApplyKubernetesConfigRequest {
  string role = 1;                  // "control-plane" or "worker"
  string cluster_name = 2;
  string cluster_cidr = 3;
  string service_cidr = 4;
  string cluster_dns = 5;
  string advertise_address = 6;
  string iface = 7;
  string api_server_endpoint = 8;
  bool initial_cluster = 9;
  string cni = 10;                  // "cilium"
  CiliumConfig cilium_config = 11;
  string etcd_initial_cluster = 12;
  bool ha_enabled = 13;
  string vip_address = 14;
  string vip_interface = 15;
  bytes kubeconfig_data = 16;
}

message ApplyKubernetesConfigResponse {
  string apply_id = 1;
  string status = 2;                // "started", "completed", "failed"
  string message = 3;
}

message ApplyRawKubernetesConfigRequest {
  string nix_config_content = 1;    // Complete Nix module text with embedded PKI
  string kubeconfig_data = 2;       // Optional: admin kubeconfig for kubectl access
}

message GetKubernetesStatusRequest {}

message GetKubernetesStatusResponse {
  bool enabled = 1;
  string role = 2;
  bool kubelet_active = 3;
  bool api_server_active = 4;
  bool etcd_active = 5;
  bool cilium_node_active = 6;
  string node_status = 7;
  int32 running_pods = 8;
}

message DrainKubernetesNodeRequest {
  bool delete_emptydir_data = 1;
  bool ignore_daemonsets = 2;
  int32 timeout_seconds = 3;
}

message DrainKubernetesNodeResponse {
  string status = 1;
  string message = 2;
}

message KubernetesAdminRequest {
  string method = 1;
  string path = 2;
  string body = 3;
  string content_type = 4;
  // When set, authenticate with this bearer token (a scoped ServiceAccount
  // token) instead of the admin client certificate.
  string bearer_token = 5;
}

message KubernetesAdminResponse {
  int32 status_code = 1;
  string body = 2;
  string message = 3;
}

message InspectLocalVmDiskRequest {
  string vm_name = 1;
  string storage_backend = 2;
  string vg_name = 3;
  string pool_name = 4;
}

message InspectLocalVmDiskResponse {
  bool success = 1;
  string message = 2;
  string mapper_path = 3;
  string backing_path = 4;
  int64 size_bytes = 5;
  bool mapper_present = 6;
  bool guest_uses_mapper = 7;
  bool memory_shared = 8;
  bool running = 9;
  string state = 10;
}

message PrepareVolumeMirrorTargetRequest {
  string vm_name = 1;
  string storage_backend = 2;
  int64 size_bytes = 3;
  string bind_addr = 4;
  string vg_name = 5;
  string pool_name = 6;
}

message PrepareVolumeMirrorTargetResponse {
  bool success = 1;
  string message = 2;
  int32 listen_port = 3;
  string export_name = 4;
  string listen_addr = 5;
  int64 device_bytes = 6;
  string mapper_path = 7;
}

message StartVolumeMirrorRequest {
  string vm_name = 1;
  string target_host = 2;
  int32 target_port = 3;
  string export_name = 4;
  string storage_backend = 5;
  string vg_name = 6;
  string pool_name = 7;
}

message StartVolumeMirrorResponse {
  bool success = 1;
  string message = 2;
  string nbd_device = 3;
}

message GetVolumeMirrorStatusRequest { string vm_name = 1; }

message GetVolumeMirrorStatusResponse {
  bool success = 1;
  string message = 2;
  bool in_sync = 3;
  int64 bytes_synced = 4;
  int64 bytes_total = 5;
  bool degraded = 6;
}

message CopyLocalVolumeRequest {
  string vm_name = 1;
  string storage_backend = 2;
  string vg_name = 3;
  string pool_name = 4;
  string target_host = 5;
  int32 target_port = 6;
  string export_name = 7;
}

message CopyLocalVolumeResponse {
  bool success = 1;
  string message = 2;
}

message CommitVolumeMirrorTargetRequest { string vm_name = 1; }

message CommitVolumeMirrorTargetResponse {
  bool success = 1;
  string message = 2;
}

message AbortVolumeMirrorRequest {
  string vm_name = 1;
  // Delete the destination copy. Ignored on the source, which only reloads
  // the mapping back to linear so the guest keeps its disk.
  bool destroy_volume = 2;
}

message AbortVolumeMirrorResponse {
  bool success = 1;
  string message = 2;
}

message ReleaseVolumeMirrorRequest {
  string vm_name = 1;
  // "target" stops the NBD export and keeps the volume.
  // "source" deletes the local copy after a successful move.
  string role = 2;
}

message ReleaseVolumeMirrorResponse {
  bool success = 1;
  string message = 2;
}

message SetLocalVmQuiescedRequest {
  string vm_name = 1;
  bool quiesced = 2;
  // With quiesced = false: start the unit again. False only lifts the
  // Restart=no drop-in, which is what a successful cold move wants — the
  // unit is about to disappear from the source configuration.
  bool start = 3;
}

message SetLocalVmQuiescedResponse {
  bool success = 1;
  string message = 2;
  bool vmm_stopped = 3;
}

message PrepareInstantDiskRequest {
  string nbd_url = 1;
  string vm_name = 2;
  int64 memory_bytes = 3;
  int32 vcpus = 4;
}
message PrepareInstantDiskResponse {
  bool success = 1;
  string message = 2;
  string disk_path = 3;
}
message FinalizeInstantDiskRequest {
  string overlay_path = 1;
  string backend_handle = 2;
  string storage_class = 3;
  string vm_name = 4;
}
message FinalizeInstantDiskResponse {
  bool success = 1;
  string message = 2;
  int64 bytes_written = 3;
  string volume_path = 4;
}

// --- Ingress gateway ---------------------------------------------------------------------------

message ApplyIngressConfigRequest {
  string config_json = 1; // rendered Caddy JSON
  string hash = 2;        // SHA-256 of config_json, echoed in status
}
message ApplyIngressConfigResponse {
  bool success = 1;
  string applied_hash = 2;
  string message = 3;
}

message GetIngressStatusRequest {}
message IngressCertInfo {
  string host = 1;
  string issuer = 2;
  string not_after = 3;
}
message IngressUpstreamInfo {
  string address = 1;
  bool healthy = 2;
}
message GetIngressStatusResponse {
  bool running = 1;
  string applied_hash = 2;
  string vip_holder = 3;
  repeated IngressCertInfo certs = 4;
  repeated IngressUpstreamInfo upstreams = 5;
  string message = 6;
}

message WriteIngressSecretRequest {
  string name = 1;     // file name under /etc/kcore/ingress, e.g. dns.env
  bytes content = 2;
}
message WriteIngressSecretResponse { bool success = 1; string path = 2; }

message ExportIngressStoreRequest {}
message ExportIngressStoreResponse {
  bytes archive = 1; // JSON document of files; opaque to the controller
  string digest = 2; // SHA-256 hex of archive
  int32 files = 3;
}
message ImportIngressStoreRequest {
  bytes archive = 1;
  string digest = 2;
}
message ImportIngressStoreResponse {
  bool success = 1;
  int32 files = 2;
  string message = 3;
}


message CheckSlurmPreflightRequest {
  string slurm_nix = 1;
  string address = 2;
  string iface = 3;
  bool compute = 4;
  repeated string member_addresses = 5;
  repeated string gpu_pci_ids = 6;
  string ceph_cluster_iface = 7;
}

message SlurmPreflightIssue {
  string check = 1;
  string message = 2;
  bool blocking = 3;
}

message CheckSlurmPreflightResponse {
  bool ok = 1;
  repeated SlurmPreflightIssue issues = 2;
}

message ApplySlurmConfigRequest {
  string slurm_nix = 1;
  // 1024 random bytes. Written to /etc/munge/munge.key, never to the Nix store.
  bytes munge_key = 2;
  // Optional slurmdbd password. Written outside the Nix store when accounting
  // is enabled.
  bytes dbd_password = 3;
  bool rebuild = 4;
  bool accounting = 5;
  repeated string gpu_pci_ids = 6;
}

message ApplySlurmConfigResponse {
  bool success = 1;
  string message = 2;
  string apply_id = 3;
}

message GetSlurmStatusRequest {}

message GetSlurmStatusResponse {
  string munge = 1;
  string slurmctld = 2;
  string slurmd = 3;
  string slurmdbd = 4;
  // `sinfo -h -N -o '%N %T'` on the controller; empty elsewhere.
  string sinfo = 5;
  string config_hash = 6;
}

message SlurmControlRequest {
  string verb = 1; // drain or resume
  string node_name = 2;
  string reason = 3;
}

message SlurmControlResponse {
  bool success = 1;
  string message = 2;
}
