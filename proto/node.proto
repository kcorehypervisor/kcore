message ApplyDiskLayoutRequest {
  // Full Nix expression containing the layout (a `disko.devices` attribute set
  // under the hood). Disko is still the tool that performs the partitioning;
  // the operator surface uses the plain word "disk".
  string disk_layout_nix = 1;
  // When true, run disko --mode format,mount. When false, syntax/eval validation only.
  bool apply = 2;
  // Maximum allowed runtime for command execution.
  int32 timeout_seconds = 3;
  // When true (the default) and the layout applies successfully, chain
  // nixos-rebuild test followed by nixos-rebuild switch so the persisted
  // layout is evaluated by NixOS. When false, skip the rebuild (validation
  // or local-only apply flows).
  bool rebuild = 4;
}

