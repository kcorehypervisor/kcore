syntax = "proto3";

package kcore.node;

option go_package = "github.com/kcore/kcore/api/node";

import "google/protobuf/timestamp.proto";

// NodeCompute service handles VM lifecycle operations
service NodeCompute {
  rpc CreateVm(CreateVmRequest) returns (CreateVmResponse);
  rpc UpdateVm(UpdateVmRequest) returns (UpdateVmResponse);
  rpc DeleteVm(DeleteVmRequest) returns (DeleteVmResponse);
  rpc SetVmDesiredState(SetVmDesiredStateRequest) returns (SetVmDesiredStateResponse);
  rpc RebootVm(RebootVmRequest) returns (RebootVmResponse);
  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
  rpc CreateWorkload(CreateWorkloadRequest) returns (CreateWorkloadResponse);
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);
  rpc SetWorkloadDesiredState(SetWorkloadDesiredStateRequest) returns (SetWorkloadDesiredStateResponse);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
}

// NodeContainer service handles container lifecycle operations on a node.
service NodeContainer {
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc GetContainer(GetContainerRequest) returns (GetContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
}

// NodeStorage service handles volume operations
service NodeStorage {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc AttachVolume(AttachVolumeRequest) returns (AttachVolumeResponse);
  rpc DetachVolume(DetachVolumeRequest) returns (DetachVolumeResponse);
  rpc SnapshotVolume(SnapshotVolumeRequest) returns (SnapshotVolumeResponse);
  rpc DeleteVolumeSnapshot(DeleteVolumeSnapshotRequest) returns (DeleteVolumeSnapshotResponse);
  rpc CloneVolume(CloneVolumeRequest) returns (CloneVolumeResponse);
  rpc RollbackVolume(RollbackVolumeRequest) returns (RollbackVolumeResponse);
  rpc FlattenVolume(FlattenVolumeRequest) returns (FlattenVolumeResponse);
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);

  // Snapshot export hooks (docs/backup.md). Backend-neutral; dispatch on
  // storage_class (ceph | zfs | lvm).
  rpc ExposeSnapshot(ExposeSnapshotRequest) returns (ExposeSnapshotResponse);
  rpc UnexposeSnapshot(UnexposeSnapshotRequest) returns (UnexposeSnapshotResponse);
  rpc ListChangedExtents(ListChangedExtentsRequest) returns (ListChangedExtentsResponse);
  rpc ReadVolumeExtents(ReadVolumeExtentsRequest) returns (stream VolumeBlock);
  rpc WriteVolumeExtents(stream WriteVolumeExtentsRequest) returns (WriteVolumeExtentsResponse);
  // Instant recovery. The overlay is a qcow2 whose backing file is the vault NBD export.
  rpc PrepareInstantDisk(PrepareInstantDiskRequest) returns (PrepareInstantDiskResponse);
  rpc FinalizeInstantDisk(FinalizeInstantDiskRequest) returns (FinalizeInstantDiskResponse);

  // Format, mount, and unmount a logical volume in this node's volume group.
  // Mount points must be under /var/lib/kcore or /mnt/kcore.
  rpc FormatVolume(FormatVolumeRequest) returns (FormatVolumeResponse);
  rpc MountVolume(MountVolumeRequest) returns (MountVolumeResponse);
  rpc UnmountVolume(UnmountVolumeRequest) returns (UnmountVolumeResponse);

  // FenceVolume cuts every Ceph client that still has the image open from
  // one of the given hosts off the cluster (`ceph osd blocklist add`), so a
  // guest restarted on another node cannot share the image with a writer on
  // a node the controller can no longer reach. It fails when the image is
  // open from any other host; the caller must not move the guest then.
  rpc FenceVolume(FenceVolumeRequest) returns (FenceVolumeResponse);
  // Lift the address-range blocklist added for a host that has come back.
  rpc UnfenceHost(UnfenceHostRequest) returns (UnfenceHostResponse);
  // Read-only: is this host still attached to Ceph? A missed heartbeat is not
  // a dead host while its OSDs are up or one of its addresses still watches
  // an image. This call does not blocklist anything.
  rpc ProbeHostStorage(ProbeHostStorageRequest) returns (ProbeHostStorageResponse);
  // Full or incremental `zfs send` of one VM volume.
  rpc PullZfsSend(PullZfsSendRequest) returns (stream ZfsSendChunk);
  // Receive that stream onto the replica dataset and mark it bootable.
  rpc RecvZfsSend(stream ZfsSendChunk) returns (RecvZfsSendResponse);

  // Host-side LUKS over a mapped RBD device (E2 per-volume encryption).
  rpc FormatEncryptedVolume(FormatEncryptedVolumeRequest)
      returns (FormatEncryptedVolumeResponse);
  rpc UnlockEncryptedVolume(UnlockEncryptedVolumeRequest)
      returns (UnlockEncryptedVolumeResponse);
  rpc LockEncryptedVolume(LockEncryptedVolumeRequest)
      returns (LockEncryptedVolumeResponse);
}

// NodeInfo service reports node capacity and status
service NodeInfo {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
}

// NodeAdmin service provides node-level management operations.
// Deployments are expected to enforce mTLS on the transport layer.
service NodeAdmin {
  // ApplyNixConfig replaces the node's /etc/nixos/configuration.nix with the
  // provided content and (optionally) triggers a nixos-rebuild.
  rpc ApplyNixConfig(ApplyNixConfigRequest) returns (ApplyNixConfigResponse);

  // Ingress gateway: load Caddy JSON through the admin socket, report
  // certificate and upstream state, and write DNS-01 style secrets.
  rpc ApplyIngressConfig(ApplyIngressConfigRequest) returns (ApplyIngressConfigResponse);
  rpc GetIngressStatus(GetIngressStatusRequest) returns (GetIngressStatusResponse);
  rpc WriteIngressSecret(WriteIngressSecretRequest) returns (WriteIngressSecretResponse);
  // Replicated certificate store: the controller reads the VIP holder's store
  // and writes it to the standby.
  rpc ExportIngressStore(ExportIngressStoreRequest) returns (ExportIngressStoreResponse);
  rpc ImportIngressStore(ImportIngressStoreRequest) returns (ImportIngressStoreResponse);

  // GetNixApplyStatus reports whether the rebuild started by a previous
  // ApplyNixConfig has finished activating. Callers that must observe the new
  // configuration (live migration handoff, drain) poll this before continuing.
  rpc GetNixApplyStatus(GetNixApplyStatusRequest) returns (GetNixApplyStatusResponse);

  // ApplyDiskLayout validates/applies a disk layout (implemented via disko)
  // for day-2 disk operations. Apply mode is only allowed when node disk
  // management mode is controller-managed.
  rpc ApplyDiskLayout(ApplyDiskLayoutRequest) returns (ApplyDiskLayoutResponse);

  // DEPRECATED: forwarding shim for the old name; will be removed one release
  // after ApplyDiskLayout has shipped. Use ApplyDiskLayout instead.
  rpc ApplyDiskoLayout(ApplyDiskoLayoutRequest) returns (ApplyDiskoLayoutResponse) {
    option deprecated = true;
  }

  // EnsureImage verifies/downloads an image file at destination_path and
  // enforces SHA256 integrity before VM activation.
  rpc EnsureImage(EnsureImageRequest) returns (EnsureImageResponse);

  // UploadImage writes a local image blob to the node image cache.
  // Accepted formats are qcow2 and raw.
  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse);
  rpc UploadImageStream(stream UploadImageChunk) returns (UploadImageResponse);

  // CheckVmSshReady resolves VM IP from DHCP leases and probes SSH port.
  rpc CheckVmSshReady(CheckVmSshReadyRequest) returns (CheckVmSshReadyResponse);

  // Ensure a per-node GuestOps SSH identity exists; returns the public key.
  rpc EnsureGuestOpsKey(EnsureGuestOpsKeyRequest) returns (EnsureGuestOpsKeyResponse);

  // Probe a guest block device size by virtio serial (SSH + lsblk).
  rpc GuestDiskProbe(GuestDiskProbeRequest) returns (GuestDiskProbeResponse);

  // Grow guest partition + filesystem for a disk identified by virtio serial.
  rpc GuestGrowFilesystem(GuestGrowFilesystemRequest)
      returns (GuestGrowFilesystemResponse);

  // Freeze or unfreeze guest filesystems via fsfreeze on / (quiesced snapshots).
  rpc GuestFsFreeze(GuestFsFreezeRequest) returns (GuestFsFreezeResponse);

  // AttachVmConsole bridges raw bytes to the Cloud Hypervisor serial Unix
  // socket (/run/kcore/<vm_name>.serial.sock). The first client message must
  // set vm_name; subsequent messages carry data only.
  rpc AttachVmConsole(stream ConsoleMessage) returns (stream ConsoleMessage);

  // ListDisks returns block devices available on the node.
  rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);

  // ListNetworkInterfaces returns network interfaces and addresses.
  rpc ListNetworkInterfaces(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse);

  // GetLvmInfo returns node LVM topology (VG/LV/PV) when available.
  rpc GetLvmInfo(GetLvmInfoRequest) returns (GetLvmInfoResponse);

  // InstallToDisk triggers a non-interactive install-to-disk workflow.
  // The implementation enforces disk wipe and reboot at the end.
  rpc InstallToDisk(InstallToDiskRequest) returns (InstallToDiskResponse);

  // Cluster rollouts: prepare / activate pinned flake outputs (see docs/cluster-updates.md).
  rpc PrepareSystemUpdate(PrepareSystemUpdateRequest) returns (PrepareSystemUpdateResponse);
  rpc ActivateSystemUpdate(ActivateSystemUpdateRequest) returns (ActivateSystemUpdateResponse);
  rpc GetSystemUpdateStatus(GetSystemUpdateStatusRequest) returns (GetSystemUpdateStatusResponse);
  rpc RollbackSystemUpdate(RollbackSystemUpdateRequest) returns (RollbackSystemUpdateResponse);
  // Migrate is the controller's job. This boots a generation that was already staged.
  rpc RebootStagedSystemUpdate(RebootStagedSystemUpdateRequest) returns (RebootStagedSystemUpdateResponse);

  // Ceph SAN lifecycle operations. All are idempotent for reconciliation.
  // Preflight checks (dry-build, OSD device, RAID, addresses, nixpkgs, DHCP mon)
  // before CreateCephCluster mutates anything.
  rpc CheckCephPreflight(CheckCephPreflightRequest) returns (CheckCephPreflightResponse);
  rpc ApplyCephConfig(ApplyCephConfigRequest) returns (ApplyCephConfigResponse);
  // Slurm host services: dry-build the fragment and check the management
  // interface before the controller writes it.
  rpc CheckSlurmPreflight(CheckSlurmPreflightRequest) returns (CheckSlurmPreflightResponse);
  rpc ApplySlurmConfig(ApplySlurmConfigRequest) returns (ApplySlurmConfigResponse);
  rpc GetSlurmStatus(GetSlurmStatusRequest) returns (GetSlurmStatusResponse);
  // Only drain and resume are accepted; scontrol runs on this node.
  rpc SlurmControl(SlurmControlRequest) returns (SlurmControlResponse);
  rpc BootstrapCephOsd(BootstrapCephOsdRequest) returns (BootstrapCephOsdResponse);
  // Create every OSD in osd_devices that is not already prepared, and retire
  // OSDs this node has that are not in that list. Retirement only touches
  // devices ceph-volume itself reports.
  rpc ReconcileCephOsds(ReconcileCephOsdsRequest) returns (ReconcileCephOsdsResponse);
  rpc GetCephHealth(GetCephHealthRequest) returns (GetCephHealthResponse);
  // Cluster capacity from `ceph df --format json` (device classes + pools).
  rpc GetCephDf(GetCephDfRequest) returns (GetCephDfResponse);
  rpc EnsureCephPool(EnsureCephPoolRequest) returns (EnsureCephPoolResponse);
  // Stop this node's mon/mgr, purge its OSDs, and queue a rebuild that drops
  // kcore.ceph from the system configuration.
  rpc TeardownCephNode(TeardownCephNodeRequest) returns (TeardownCephNodeResponse);
  // `ceph mon rm` on a member that is still in quorum.
  rpc RemoveCephMon(RemoveCephMonRequest) returns (RemoveCephMonResponse);
  // Run on a surviving member: mark every OSD under CRUSH host `host` out and
  // report whether every placement group is active+clean again, i.e. the
  // host's data has been re-replicated elsewhere and it can be torn down.
  rpc DrainCephHost(DrainCephHostRequest) returns (DrainCephHostResponse);
  rpc GetHostCpuFlags(GetHostCpuFlagsRequest) returns (GetHostCpuFlagsResponse);

  // Live migration peer steps (controller orchestrates source + destination).
  rpc PrepareLiveMigrateReceive(PrepareLiveMigrateReceiveRequest)
      returns (PrepareLiveMigrateReceiveResponse);
  rpc WaitLiveMigrateReceive(WaitLiveMigrateReceiveRequest)
      returns (WaitLiveMigrateReceiveResponse);
  rpc AbortLiveMigrateReceive(AbortLiveMigrateReceiveRequest)
      returns (AbortLiveMigrateReceiveResponse);
  // Read-only view of this node's live-migrate receive bookkeeping for a VM.
  // A prepare clears a session that is already dead (no matching VMM, port not
  // listening). A session that still looks live is left alone: clearing it
  // would destroy the guest. See docs/vm-migration.md.
  rpc GetLiveMigrateReceiveStatus(GetLiveMigrateReceiveStatusRequest)
      returns (GetLiveMigrateReceiveStatusResponse);
  // Best-effort progress for an in-flight receive (phase + estimate flags).
  rpc GetLiveMigrateProgress(GetLiveMigrateProgressRequest)
      returns (GetLiveMigrateProgressResponse);
  rpc SendLiveMigrate(SendLiveMigrateRequest) returns (SendLiveMigrateResponse);
  // Host CPU facts a live-migration destination compares against its own
  // before it maps volumes and spawns a receiver (vendor, model, TSC rate,
  // hardware TSC scaling). Cloud Hypervisor checks CPUID feature bits itself;
  // this covers what it does not report usefully.
  rpc GetHostCpuInfo(GetHostCpuInfoRequest) returns (GetHostCpuInfoResponse);
  // Options the node's installed ch-vm Nix module understands, from
  // /etc/kcore/ch-vm-features. The controller only emits newer options to
  // nodes that list them; an older node (or agent) reports nothing and gets
  // the baseline config.
  rpc GetChVmModuleFeatures(GetChVmModuleFeaturesRequest)
      returns (GetChVmModuleFeaturesResponse);
  rpc FinalizeLiveMigrateSource(FinalizeLiveMigrateSourceRequest)
      returns (FinalizeLiveMigrateSourceResponse);
  rpc FinalizeLiveMigrateDest(FinalizeLiveMigrateDestRequest)
      returns (FinalizeLiveMigrateDestResponse);

  // Local-disk (LVM/ZFS) migration. The destination exports a new LV/zvol over
  // NBD; the source mirrors the guest disk onto it with dm-mirror, then the
  // existing Cloud Hypervisor send/receive moves memory. A stopped guest is
  // copied with qemu-img instead of a mirror. See docs/vm-migration.md.
  rpc InspectLocalVmDisk(InspectLocalVmDiskRequest) returns (InspectLocalVmDiskResponse);
  rpc PrepareVolumeMirrorTarget(PrepareVolumeMirrorTargetRequest)
      returns (PrepareVolumeMirrorTargetResponse);
  rpc StartVolumeMirror(StartVolumeMirrorRequest) returns (StartVolumeMirrorResponse);
  rpc GetVolumeMirrorStatus(GetVolumeMirrorStatusRequest)
      returns (GetVolumeMirrorStatusResponse);
  rpc CopyLocalVolume(CopyLocalVolumeRequest) returns (CopyLocalVolumeResponse);
  rpc CommitVolumeMirrorTarget(CommitVolumeMirrorTargetRequest)
      returns (CommitVolumeMirrorTargetResponse);
  rpc AbortVolumeMirror(AbortVolumeMirrorRequest) returns (AbortVolumeMirrorResponse);
  rpc ReleaseVolumeMirror(ReleaseVolumeMirrorRequest) returns (ReleaseVolumeMirrorResponse);
  // Stop the guest and hold systemd restart, or undo that, for a cold copy.
  rpc SetLocalVmQuiesced(SetLocalVmQuiescedRequest) returns (SetLocalVmQuiescedResponse);

  // Hotplug a mapped block device into a running Cloud Hypervisor guest.
  rpc HotAddDisk(HotAddDiskRequest) returns (HotAddDiskResponse);
  rpc HotRemoveDisk(HotRemoveDiskRequest) returns (HotRemoveDiskResponse);

  // RotateNodeCert asks the node-agent to rotate its own TLS identity: the
  // node generates a fresh keypair, submits a CSR to the controller
  // (Controller.SignNodeCsr), installs the signed chain atomically and
  // reloads its listener. The private key never leaves the node. A failure
  // leaves the previous certificate in place and serving.
  rpc RotateNodeCert(RotateNodeCertRequest) returns (RotateNodeCertResponse);
  
  // Kubernetes configuration management
  rpc ApplyKubernetesConfig(ApplyKubernetesConfigRequest) returns (ApplyKubernetesConfigResponse);
  rpc ApplyRawKubernetesConfig(ApplyRawKubernetesConfigRequest) returns (ApplyKubernetesConfigResponse);
  rpc GetKubernetesStatus(GetKubernetesStatusRequest) returns (GetKubernetesStatusResponse);
  rpc DrainKubernetesNode(DrainKubernetesNodeRequest) returns (DrainKubernetesNodeResponse);
  // Read /etc/kubernetes/admin.conf on this node and call the Kubernetes API.
  // The controller uses this instead of running kubectl.
  rpc KubernetesAdmin(KubernetesAdminRequest) returns (KubernetesAdminResponse);
}

// VM specification
message VmSpec {
  string id = 1;
  string name = 2;
  int32 cpu = 3;
  int64 memory_bytes = 4;
  repeated Disk disks = 5;
  repeated Nic nics = 6;
}

message Disk {
  string name = 1;
  string backend_handle = 2; // e.g., /dev/vg0/vm-123-root or /path/to/file.qcow2
  string bus = 3; // virtio, scsi, etc.
  string device = 4; // vda, sda, etc.
}

message Nic {
  string network = 1;
  string model = 2; // virtio, e1000, etc.
  string mac_address = 3;
}

// VM status
enum VmState {
  VM_STATE_UNKNOWN = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_RUNNING = 2;
  VM_STATE_PAUSED = 3;
  VM_STATE_ERROR = 4;
}

message VmStatus {
  string id = 1;
  VmState state = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// CreateVm
message CreateVmRequest {
  VmSpec spec = 1;
  
  // Optional: Boot image (cloud-init images, ISOs, etc.)
  string image_uri = 2;    // HTTP/HTTPS URI to download image (e.g., "https://cloud.debian.org/images/...")
  string image_path = 3;   // Path to local image file (e.g., "/var/lib/images/debian-12.qcow2")
  string image_format = 4; // Image format: qcow2, raw, iso (auto-detected if empty)
}

message CreateVmResponse {
  VmStatus status = 1;
}

// UpdateVm
message UpdateVmRequest {
  VmSpec spec = 1;
}

message UpdateVmResponse {
  VmStatus status = 1;
}

// DeleteVm
message DeleteVmRequest {
  string vm_id = 1;
}

message DeleteVmResponse {}

enum VmDesiredState {
  VM_DESIRED_STATE_UNSPECIFIED = 0;
  VM_DESIRED_STATE_RUNNING = 1;
  VM_DESIRED_STATE_STOPPED = 2;
}

message SetVmDesiredStateRequest {
  string vm_id = 1;
  VmDesiredState desired_state = 2;
}

message SetVmDesiredStateResponse {
  VmStatus status = 1;
}

// RebootVm
message RebootVmRequest {
  string vm_id = 1;
  bool force = 2;
}

message RebootVmResponse {
  VmStatus status = 1;
}

// GetVm
message GetVmRequest {
  string vm_id = 1;
}

message GetVmResponse {
  VmSpec spec = 1;
  VmStatus status = 2;
}

// ListVms
message ListVmsRequest {}

message ListVmsResponse {
  repeated VmInfo vms = 1;
}

message VmInfo {
  string id = 1;
  string name = 2;
  VmState state = 3;
  int32 cpu = 4;
  int64 memory_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum ContainerState {
  CONTAINER_STATE_UNKNOWN = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_STOPPED = 3;
  CONTAINER_STATE_ERROR = 4;
}

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_VM = 1;
  WORKLOAD_KIND_CONTAINER = 2;
}

enum WorkloadDesiredState {
  WORKLOAD_DESIRED_STATE_UNSPECIFIED = 0;
  WORKLOAD_DESIRED_STATE_RUNNING = 1;
  WORKLOAD_DESIRED_STATE_STOPPED = 2;
}

message ContainerSpec {
  string name = 1;
  string image = 2;
  string network = 3; // host runtime network name (e.g. bridge or kcore-managed bridge)
  repeated string command = 4;
  map<string, string> env = 5;
  repeated string ports = 6; // host:container or ip:host:container
  string storage_backend = 7; // filesystem|lvm|zfs
  int64 storage_size_bytes = 8;
  string mount_target = 9; // container mount point, defaults to /data
}

message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  ContainerState state = 4;
  string status = 5;
}

message CreateContainerRequest {
  ContainerSpec spec = 1;
}

message CreateContainerResponse {
  ContainerInfo container = 1;
}

message StartContainerRequest {
  string name = 1;
}

message StartContainerResponse {
  ContainerInfo container = 1;
}

message StopContainerRequest {
  string name = 1;
}

message StopContainerResponse {
  ContainerInfo container = 1;
}

message DeleteContainerRequest {
  string name = 1;
  bool force = 2;
}

message DeleteContainerResponse {
  bool success = 1;
}

message GetContainerRequest {
  string name = 1;
}

message GetContainerResponse {
  ContainerInfo container = 1;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated ContainerInfo containers = 1;
}

message WorkloadInfo {
  WorkloadKind kind = 1;
  VmInfo vm = 2;
  ContainerInfo container = 3;
}

message CreateWorkloadRequest {
  WorkloadKind kind = 1;
  VmSpec vm_spec = 2;
  ContainerSpec container_spec = 3;
  string image_uri = 4;
  string image_path = 5;
  string image_format = 6;
}

message CreateWorkloadResponse {
  WorkloadInfo workload = 1;
}

message DeleteWorkloadRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
  bool force = 3;
}

message DeleteWorkloadResponse {
  bool success = 1;
}

message SetWorkloadDesiredStateRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
  WorkloadDesiredState desired_state = 3;
}

message SetWorkloadDesiredStateResponse {
  WorkloadInfo workload = 1;
}

message GetWorkloadRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
}

message GetWorkloadResponse {
  WorkloadInfo workload = 1;
}

message ListWorkloadsRequest {
  WorkloadKind kind = 1; // optional filter
}

message ListWorkloadsResponse {
  repeated WorkloadInfo workloads = 1;
}

// CreateVolume
message CreateVolumeRequest {
  string volume_id = 1;
  string storage_class = 2;
  int64 size_bytes = 3;
  map<string, string> parameters = 4; // StorageClass-specific params
  // LVM logical volume or ZFS zvol name. Empty keeps <prefix><volume_id>.
  // Set this to create a volume that is not a VM disk and does not use the prefix.
  string lv_name = 5;
}

message CreateVolumeResponse {
  string backend_handle = 1;
}

// DeleteVolume
message DeleteVolumeRequest {
  string backend_handle = 1;
}

message DeleteVolumeResponse {}

// AttachVolume
message AttachVolumeRequest {
  string backend_handle = 1;
  string vm_id = 2;
  string target_device = 3; // vda, sda, etc.
  string bus = 4; // virtio, scsi, etc.
}

message AttachVolumeResponse {}

// DetachVolume
message DetachVolumeRequest {
  string backend_handle = 1;
  string vm_id = 2;
}

message DetachVolumeResponse {}

message SnapshotVolumeRequest {
  // pool/image (ceph), pool/dataset (zfs), or vg/lv (lvm)
  string backend_handle = 1;
  string snapshot_name = 2;
  bool protect = 3;
  // ceph | zfs | lvm; empty = infer from handle
  string storage_class = 4;
}

message SnapshotVolumeResponse {
  string snapshot_handle = 1; // pool/image@snap (or class-equivalent)
}

message DeleteVolumeSnapshotRequest {
  string backend_handle = 1;
  string snapshot_name = 2;
  bool unprotect = 3;
  string storage_class = 4;
}

message DeleteVolumeSnapshotResponse {}

message CloneVolumeRequest {
  string parent_handle = 1;
  string parent_snapshot = 2;
  string child_image = 3;
  string storage_class = 4;
}

message CloneVolumeResponse {
  string backend_handle = 1;
}

message RollbackVolumeRequest {
  string backend_handle = 1;
  string snapshot_name = 2;
  string storage_class = 3;
}

message RollbackVolumeResponse {}

message ExposeSnapshotRequest {
  string backend_handle = 1;
  string snapshot_name = 2;
  string storage_class = 3;
  int32 lease_seconds = 4;
}

message ExposeSnapshotResponse {
  string lease_id = 1;
  string device_path = 2;
  int64 size_bytes = 3;
  int32 block_size = 4;
}

message UnexposeSnapshotRequest {
  string lease_id = 1;
}

message UnexposeSnapshotResponse {}

message Extent {
  int64 offset = 1;
  int64 length = 2;
}

message ListChangedExtentsRequest {
  string backend_handle = 1;
  string storage_class = 2;
  string from_snapshot = 3;
  string to_snapshot = 4;
}

message ListChangedExtentsResponse {
  repeated Extent extents = 1;
  bool supported = 2;
  string source = 3;
}

message ReadVolumeExtentsRequest {
  string lease_id = 1;
  repeated Extent extents = 2;
  int32 block_size = 3;
  bool elide_zero_blocks = 4;
}

message VolumeBlock {
  int64 offset = 1;
  oneof body {
    bytes data = 2;
    int64 zero_length = 3;
  }
}

message WriteVolumeExtentsRequest {
  oneof msg {
    WriteVolumeTarget target = 1;
    VolumeBlock block = 2;
  }
}

message WriteVolumeTarget {
  string backend_handle = 1;
  string storage_class = 2;
  bool punch_zero_runs = 3;
}

message WriteVolumeExtentsResponse {
  int64 bytes_written = 1;
  int64 blocks_written = 2;
  int64 zero_runs = 3;
}

message FlattenVolumeRequest {
  string backend_handle = 1; // pool/image (clone)
}

message FlattenVolumeResponse {}

message ResizeVolumeRequest {
  string backend_handle = 1; // pool/image
  int64 size_bytes = 2;
  // Pass through to `rbd resize --allow-shrink` when shrinking.
  bool allow_shrink = 3;
}

message ResizeVolumeResponse {
  bool success = 1;
  string message = 2;
  int64 size_bytes = 3;
}

message FormatVolumeRequest {
  // /dev/<vg>/<lv>
  string backend_handle = 1;
  // ext4 or xfs
  string fs_type = 2;
  // Replace an existing filesystem. A mounted volume is refused either way.
  bool force = 3;
}

message FormatVolumeResponse {
  bool success = 1;
  string message = 2;
}

message MountVolumeRequest {
  string backend_handle = 1;
  // Directory under /var/lib/kcore or /mnt/kcore.
  string mount_point = 2;
  // ext4 or xfs. Empty uses the filesystem already on the volume.
  string fs_type = 3;
  // Install a systemd mount unit so the volume comes back after reboot.
  bool persistent = 4;
}

message MountVolumeResponse {
  bool success = 1;
  string message = 2;
  string mount_point = 3;
}

