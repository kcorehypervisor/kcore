syntax = "proto3";

package kcore.controller;

option go_package = "github.com/kcore/kcore/api/controller";

import "google/protobuf/timestamp.proto";

// Controller service - orchestrates VMs across nodes
service Controller {
  // Node registration and heartbeat
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SyncVmState(SyncVmStateRequest) returns (SyncVmStateResponse);
  rpc SyncWorkloadState(SyncWorkloadStateRequest) returns (SyncWorkloadStateResponse);
  
  // VM operations (declarative desired-state API managed by controller)
  rpc CreateVm(CreateVmRequest) returns (CreateVmResponse);
  rpc UpdateVm(UpdateVmRequest) returns (UpdateVmResponse);
  rpc DeleteVm(DeleteVmRequest) returns (DeleteVmResponse);
  rpc SetVmDesiredState(SetVmDesiredStateRequest) returns (SetVmDesiredStateResponse);
  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  // AttachVmConsole proxies a bidirectional serial console session to the
  // node hosting the VM (see NodeAdmin.AttachVmConsole).
  rpc AttachVmConsole(stream ConsoleMessage) returns (stream ConsoleMessage);
  rpc CreateWorkload(CreateWorkloadRequest) returns (CreateWorkloadResponse);
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);
  rpc SetWorkloadDesiredState(SetWorkloadDesiredStateRequest) returns (SetWorkloadDesiredStateResponse);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  // One NixOS services.postgresql database per node. v1 is a single database.
  rpc CreatePostgresql(CreatePostgresqlRequest) returns (CreatePostgresqlResponse);
  rpc DeletePostgresql(DeletePostgresqlRequest) returns (DeletePostgresqlResponse);
  rpc GetPostgresql(GetPostgresqlRequest) returns (GetPostgresqlResponse);
  rpc ListPostgresqls(ListPostgresqlsRequest) returns (ListPostgresqlsResponse);
  rpc CreateSecurityGroup(CreateSecurityGroupRequest) returns (CreateSecurityGroupResponse);
  rpc GetSecurityGroup(GetSecurityGroupRequest) returns (GetSecurityGroupResponse);
  rpc ListSecurityGroups(ListSecurityGroupsRequest) returns (ListSecurityGroupsResponse);
  rpc DeleteSecurityGroup(DeleteSecurityGroupRequest) returns (DeleteSecurityGroupResponse);
  rpc AttachSecurityGroup(AttachSecurityGroupRequest) returns (AttachSecurityGroupResponse);
  rpc DetachSecurityGroup(DetachSecurityGroupRequest) returns (DetachSecurityGroupResponse);
  
  // Node operations
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  // GPUs reported by node agents. Names (radeon0) are per node.
  rpc ListGpus(ListGpusRequest) returns (ListGpusResponse);
  // Full PCI inventory: AI GPUs, NICs, NVMe, and raw groups.
  rpc ListPciDevices(ListGpusRequest) returns (ListGpusResponse);

  // SSH key management
  rpc CreateSshKey(CreateSshKeyRequest) returns (CreateSshKeyResponse);
  rpc DeleteSshKey(DeleteSshKeyRequest) returns (DeleteSshKeyResponse);
  rpc ListSshKeys(ListSshKeysRequest) returns (ListSshKeysResponse);
  rpc GetSshKey(GetSshKeyRequest) returns (GetSshKeyResponse);

  // Node lifecycle
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  // Live-migrate a Ceph-backed VM to another CephCluster member (shared RBD).
  rpc MigrateVm(MigrateVmRequest) returns (MigrateVmResponse);
  // Report each node's live-migrate receive bookkeeping for a VM. Read-only,
  // and the thing to run first when a migration keeps failing with
  // ALREADY_EXISTS. See docs/vm-migration.md.
  rpc GetLiveMigrateReceiveStatus(GetLiveMigrateReceiveStatusRequest)
      returns (GetLiveMigrateReceiveStatusResponse);
  // Clear a stranded receive session on one node. Destructive and refused
  // unless `force` is set, so the default answer is a report of what would be
  // cleared rather than the clearing itself.
  rpc ResetLiveMigrateReceive(ResetLiveMigrateReceiveRequest)
      returns (ResetLiveMigrateReceiveResponse);
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);
  rpc RejectNode(RejectNodeRequest) returns (RejectNodeResponse);
  // Cordon keeps the node and its VMs, and stops the scheduler from placing
  // anything new on it. Uncordon returns it to scheduling.
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse);
  // Remove the node after it has no VMs or networks. Revokes every certificate
  // issued to it before the row is deleted.
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  // Summary of node readiness, VM placement, certificate expiry, and
  // replication conflicts. Read-only.
  rpc GetClusterHealth(GetClusterHealthRequest) returns (GetClusterHealthResponse);
  // Consistent SQLite snapshot of the controller database.
  rpc BackupCluster(BackupClusterRequest) returns (BackupClusterResponse);
  // Replace the controller database from a snapshot. `confirm` must be true.
  rpc RestoreCluster(RestoreClusterRequest) returns (RestoreClusterResponse);

  // Certificate rotation
  // DEPRECATED: ships a controller-generated private key over the wire. Use
  // SignNodeCsr, which keeps the node private key on the node. Kept so older
  // node-agents keep renewing until they are upgraded.
  rpc RenewNodeCert(RenewNodeCertRequest) returns (RenewNodeCertResponse);
  // Bootstrap a node cert/key pair signed by controller sub-CA for fresh installs.
  rpc IssueNodeBootstrapCert(IssueNodeBootstrapCertRequest) returns (IssueNodeBootstrapCertResponse);
  rpc RotateSubCa(RotateSubCaRequest) returns (RotateSubCaResponse);
  rpc ReloadTls(ReloadTlsRequest) returns (ReloadTlsResponse);

  // PKI lifecycle: CSR-based rotation, inventory, revocation, CRL/OCSP.
  // The node generates its own keypair and submits a CSR; the private key
  // never leaves the node.
  rpc SignNodeCsr(SignNodeCsrRequest) returns (SignNodeCsrResponse);
  // Operator-triggered rotation for one node or the whole cluster.
  rpc RotateNodeCerts(RotateNodeCertsRequest) returns (RotateNodeCertsResponse);
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);
  rpc GetCrl(GetCrlRequest) returns (GetCrlResponse);
  rpc GetPkiStatus(GetPkiStatusRequest) returns (GetPkiStatusResponse);

  // Compliance
  rpc GetComplianceReport(GetComplianceReportRequest) returns (GetComplianceReportResponse);
  // Cryptographic posture of this controller (library, suites, rate limit).
  rpc GetCryptoConfig(GetCryptoConfigRequest) returns (GetCryptoConfigResponse);
  // CycloneDX SBOM: the installed release document, or the Cargo.lock graph
  // embedded at build time when no file is configured.
  rpc ExportSbom(ExportSbomRequest) returns (ExportSbomResponse);
  // Append-only audit trail (actor = mTLS peer CN until RBAC).
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Network overview: host interfaces from each node + default network config
  rpc GetNetworkOverview(GetNetworkOverviewRequest) returns (GetNetworkOverviewResponse);

  // Storage overview: cluster-wide VM data-plane backends (filesystem / LVM / ZFS), LUKS stats,
  // and per-node block inventory from each node agent (lsblk).
  rpc GetStorageOverview(GetStorageOverviewRequest) returns (GetStorageOverviewResponse);

  // Volume inventory and lifecycle (Ceph RBD; many volumes per VM).
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc AttachVolume(AttachVolumeRequest) returns (AttachVolumeResponse);
  rpc DetachVolume(DetachVolumeRequest) returns (DetachVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // Long-running VM operations (live migrate progress / cancel).
  rpc ListVmOperations(ListVmOperationsRequest) returns (ListVmOperationsResponse);
  rpc GetVmOperation(GetVmOperationRequest) returns (GetVmOperationResponse);
  rpc CancelVmOperation(CancelVmOperationRequest) returns (CancelVmOperationResponse);

  // Volume snapshots (Ceph RBD crash-consistent).
  rpc CreateVolumeSnapshot(CreateVolumeSnapshotRequest) returns (CreateVolumeSnapshotResponse);
  rpc ListVolumeSnapshots(ListVolumeSnapshotsRequest) returns (ListVolumeSnapshotsResponse);
  rpc DeleteVolumeSnapshot(DeleteVolumeSnapshotRequest) returns (DeleteVolumeSnapshotResponse);
  rpc RestoreVolume(RestoreVolumeRequest) returns (RestoreVolumeResponse);
  rpc FlattenVolume(FlattenVolumeRequest) returns (FlattenVolumeResponse);
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);
  // In-place LUKS over an existing plain RBD image (data-destructive; see destroy_data).
  rpc EncryptVolume(EncryptVolumeRequest) returns (EncryptVolumeResponse);

  rpc CreateSnapshotPolicy(CreateSnapshotPolicyRequest) returns (CreateSnapshotPolicyResponse);
  rpc GetSnapshotPolicy(GetSnapshotPolicyRequest) returns (GetSnapshotPolicyResponse);
  rpc ListSnapshotPolicies(ListSnapshotPoliciesRequest) returns (ListSnapshotPoliciesResponse);
  rpc DeleteSnapshotPolicy(DeleteSnapshotPolicyRequest) returns (DeleteSnapshotPolicyResponse);

  // DiskLayout resource — per-node declarative disk layout. Implemented on the
  // node via disko; the operator surface uses the plain word "disk". Each
  // DiskLayout targets exactly one node; dangerous requests (those that would
  // touch a device currently backing an active workload) are refused by both
  // the controller pre-flight and the authoritative node-agent re-classifier.
  rpc CreateDiskLayout(CreateDiskLayoutRequest) returns (CreateDiskLayoutResponse);
  rpc GetDiskLayout(GetDiskLayoutRequest) returns (GetDiskLayoutResponse);
  rpc ListDiskLayouts(ListDiskLayoutsRequest) returns (ListDiskLayoutsResponse);
  rpc DeleteDiskLayout(DeleteDiskLayoutRequest) returns (DeleteDiskLayoutResponse);

  // Read-only pre-flight that runs the controller-side classifier without
  // persisting or dispatching to the node. Used by `kctl diff disklayout` so
  // operators can see SAFE/DANGEROUS before applying.
  rpc ClassifyDiskLayout(ClassifyDiskLayoutRequest) returns (ClassifyDiskLayoutResponse);

  // ClusterUpdate — flake-pinned kcore / host OS rollouts across nodes.
  rpc CreateClusterUpdate(CreateClusterUpdateRequest) returns (CreateClusterUpdateResponse);
  rpc GetClusterUpdate(GetClusterUpdateRequest) returns (GetClusterUpdateResponse);
  rpc ListClusterUpdates(ListClusterUpdatesRequest) returns (ListClusterUpdatesResponse);
  rpc PlanClusterUpdate(PlanClusterUpdateRequest) returns (PlanClusterUpdateResponse);
  rpc ApproveClusterUpdate(ApproveClusterUpdateRequest) returns (ApproveClusterUpdateResponse);
  rpc CancelClusterUpdate(CancelClusterUpdateRequest) returns (CancelClusterUpdateResponse);
  rpc RollbackClusterUpdate(RollbackClusterUpdateRequest) returns (RollbackClusterUpdateResponse);

  // CephCluster — declarative cluster-scoped Ceph SAN configuration.
  rpc CreateCephCluster(CreateCephClusterRequest) returns (CreateCephClusterResponse);
  rpc GetCephCluster(GetCephClusterRequest) returns (GetCephClusterResponse);
  rpc ListCephClusters(ListCephClustersRequest) returns (ListCephClustersResponse);
  rpc DeleteCephCluster(DeleteCephClusterRequest) returns (DeleteCephClusterResponse);

  // SharedFilesystem (CephFS) — cluster-scoped POSIX file service on Ceph.
  rpc CreateSharedFilesystem(CreateSharedFilesystemRequest) returns (CreateSharedFilesystemResponse);
  rpc GetSharedFilesystem(GetSharedFilesystemRequest) returns (GetSharedFilesystemResponse);
  rpc ListSharedFilesystems(ListSharedFilesystemsRequest) returns (ListSharedFilesystemsResponse);
  rpc DeleteSharedFilesystem(DeleteSharedFilesystemRequest) returns (DeleteSharedFilesystemResponse);

  // ObjectStore (RGW) — S3-compatible object storage on Ceph.
  rpc CreateObjectStore(CreateObjectStoreRequest) returns (CreateObjectStoreResponse);
  rpc GetObjectStore(GetObjectStoreRequest) returns (GetObjectStoreResponse);
  rpc ListObjectStores(ListObjectStoresRequest) returns (ListObjectStoresResponse);
  rpc DeleteObjectStore(DeleteObjectStoreRequest) returns (DeleteObjectStoreResponse);
  rpc CreateObjectUser(CreateObjectUserRequest) returns (CreateObjectUserResponse);
  rpc DeleteObjectUser(DeleteObjectUserRequest) returns (DeleteObjectUserResponse);

  // RBAC: operators identified by client cert CN=kctl:<name>. Legacy CN=kctl is bootstrap-only.
  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse);
  rpc DeleteOperator(DeleteOperatorRequest) returns (DeleteOperatorResponse);
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse);
  rpc GrantOperatorRole(GrantOperatorRoleRequest) returns (GrantOperatorRoleResponse);
  rpc RevokeOperatorRole(RevokeOperatorRoleRequest) returns (RevokeOperatorRoleResponse);
  rpc IssueOperatorCert(IssueOperatorCertRequest) returns (IssueOperatorCertResponse);
}

message RegisterNodeRequest {
  string node_id = 1;
  string hostname = 2;
  string address = 3; // gRPC endpoint address
  NodeCapacity capacity = 4;
  repeated string labels = 5; // e.g., "dc=dc-a", "rack=rack-1"
  StorageBackendType storage_backend = 6; // Node storage backend capability (filesystem/lvm/zfs)
  bool disable_vxlan = 7; // When true, node does not support VXLAN overlay networking
  int32 cert_expiry_days = 8; // Days until node TLS certificate expires
  string luks_method = 9;     // "tpm2", "key-file", or "" (not reported)
  string dc_id = 10;          // Datacenter identifier (e.g., "DC1", "DC2")
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  string approval_status = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  NodeUsage usage = 2;
  int32 cert_expiry_days = 3; // Days until node TLS certificate expires
  string luks_method = 4;     // "tpm2", "key-file", or "" (not reported)
  // Present only when the node agent scanned PCI. Empty with gpus_reported
  // means the node has no PCI devices. Omitted (gpus_reported false) leaves
  // inventory alone. Rows are GPUs, NICs, NVMe, and raw groups; see GpuInfo.kind.
  repeated GpuInfo gpus = 5;
  bool gpus_reported = 6;
}

message GpuInfo {
  string name = 1;            // radeon0, nic0, nvme0, or a raw BDF
  string family = 2;          // radeon, nvidia, intel, accel, nic, nvme, raw
  string model = 3;           // AMD 1002:744c
  string address = 4;         // primary function, 0000:03:00.0
  repeated string pci_devices = 5;
  int32 iommu_group = 6;      // -1 when the device has no IOMMU group
  bool assignable = 7;
  string blocked_reason = 8;
  string node_id = 9;         // set by the controller when listing
  string assigned_vm = 10;    // VM name when this device is in use
  string kind = 11;           // gpu, nic, nvme, raw; empty means gpu
  string role = 12;           // compute (AI), platform (host iGPU), passthrough
  string class_code = 13;     // 0x030200
  string characteristics = 14; // purpose=ai class=... vendor=... iommu-companions=...
  string driver = 15;
}

message ListGpusRequest {
  string node_id = 1; // empty lists every node
}

message ListGpusResponse {
  repeated GpuInfo gpus = 1;
}

message HeartbeatResponse {
  bool success = 1;
}

message SyncVmStateRequest {
  string node_id = 1;
  repeated VmInfo vms = 2;  // Complete list of VMs currently on this node
}

message SyncVmStateResponse {
  bool success = 1;
}

message SyncWorkloadStateRequest {
  string node_id = 1;
  repeated WorkloadRuntimeInfo workloads = 2;
}

message SyncWorkloadStateResponse {
  bool success = 1;
}

message NodeCapacity {
  int32 cpu_cores = 1;
  int64 memory_bytes = 2;
}

message NodeUsage {
  int32 cpu_cores_used = 1;
  int64 memory_bytes_used = 2;
}

enum StorageBackendType {
  STORAGE_BACKEND_TYPE_UNSPECIFIED = 0;
  STORAGE_BACKEND_TYPE_FILESYSTEM = 1;
  STORAGE_BACKEND_TYPE_LVM = 2;
  STORAGE_BACKEND_TYPE_ZFS = 3;
  STORAGE_BACKEND_TYPE_CEPH = 4;
}

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_VM = 1;
  WORKLOAD_KIND_CONTAINER = 2;
}

enum WorkloadDesiredState {
  WORKLOAD_DESIRED_STATE_UNSPECIFIED = 0;
  WORKLOAD_DESIRED_STATE_RUNNING = 1;
  WORKLOAD_DESIRED_STATE_STOPPED = 2;
}

enum ContainerState {
  CONTAINER_STATE_UNKNOWN = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_STOPPED = 3;
  CONTAINER_STATE_ERROR = 4;
}

message ContainerSpec {
  string name = 1;
  string image = 2;
  string network = 3;
  repeated string command = 4;
  map<string, string> env = 5;
  repeated string ports = 6;
  string storage_backend = 7; // filesystem|lvm|zfs
  int64 storage_size_bytes = 8;
  string mount_target = 9;
  WorkloadDesiredState desired_state = 10; // declarative desired state (running|stopped)
}

// Reconcile action returned by idempotent Create* (upsert) RPCs.
enum ApplyAction {
  APPLY_ACTION_UNSPECIFIED = 0;
  APPLY_ACTION_CREATED = 1;
  APPLY_ACTION_UPDATED = 2;
  APPLY_ACTION_UNCHANGED = 3;
}

message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  ContainerState state = 4;
  string status = 5;
  string node_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message WorkloadRuntimeInfo {
  string id = 1;
  string name = 2;
  WorkloadKind kind = 3;
  VmState vm_state = 4;
  ContainerState container_state = 5;
}

// VM Operations - all include target_node for explicit node selection

message CreateVmRequest {
  string target_node = 1;  // Node address (e.g., "192.168.1.10:9091") - optional, controller picks if empty
  VmSpec spec = 2;
  string image_url = 3;     // HTTPS image URL to download on target node
  string image_sha256 = 4;  // Required SHA256 checksum for image_url
  string cloud_init_user_data = 5;  // Optional cloud-init user-data (YAML); uses default if empty
  string image_path = 6;    // Optional node-local image path (alternative to image_url/image_sha256)
  string image_format = 7;  // Required when image_path is used: qcow2 or raw
  repeated string ssh_key_names = 8;  // SSH key names to inject (looked up from controller DB)
  StorageBackendType storage_backend = 9; // Required VM storage backend for compatibility checks
  int64 storage_size_bytes = 10; // Required VM storage size in bytes (> 0)
  string target_dc = 11;    // Datacenter preference (optional; controller picks any DC if empty)
  repeated string node_labels = 12; // required node labels, e.g. "dc=dc-a"
  string anti_affinity = 13; // HA group: do not colocate two VMs with the same value
}

message CreateVmResponse {
  string vm_id = 1;
  string node_id = 2;  // Which node created it
  VmState state = 3;
  ApplyAction action = 4;              // upsert outcome: created|updated|unchanged
  repeated string changed_fields = 5;  // names of mutated fields when action == UPDATED
}

message UpdateVmRequest {
  string vm_id = 1;
  string target_node = 2;  // Optional
  int32 cpu = 3;            // New CPU count (0 = no change)
  int64 memory_bytes = 4;   // New memory (0 = no change)
}

message UpdateVmResponse {
  bool success = 1;
  string message = 2;
}

message DeleteVmRequest {
  string vm_id = 1;
  string target_node = 2;  // Optional - controller finds it if empty
  // When true, also delete Ceph data volumes (and their RBD images). Default
  // keeps data volumes as detached inventory.
  bool delete_data_volumes = 3;
}

message DeleteVmResponse {
  bool success = 1;
}

enum VmDesiredState {
  VM_DESIRED_STATE_UNSPECIFIED = 0;
  VM_DESIRED_STATE_RUNNING = 1;
  VM_DESIRED_STATE_STOPPED = 2;
}

message SetVmDesiredStateRequest {
  string vm_id = 1;
  VmDesiredState desired_state = 2;
  string target_node = 3;  // Optional
}

message SetVmDesiredStateResponse {
  VmState state = 1;
}

message GetVmRequest {
  string vm_id = 1;
  string target_node = 2;  // Optional
}

message GetVmResponse {
  VmSpec spec = 1;
  VmStatus status = 2;
  string node_id = 3;  // Which node it's on
  string assigned_ip = 4; // Controller-assigned VM IP (static/reserved when available)
}

message ListVmsRequest {
  string target_node = 1;  // Optional - list from specific node, or all nodes if empty
}

message ListVmsResponse {
  repeated VmInfo vms = 1;
}

// Bidirectional console payload (proxied to NodeAdmin.AttachVmConsole).
message ConsoleMessage {
  string vm_name = 1; // required on the first client → server message
  bytes data = 2;     // raw serial bytes
}

message CreateWorkloadRequest {
  WorkloadKind kind = 1;
  string target_node = 2;
  VmSpec vm_spec = 3;
  ContainerSpec container_spec = 4;
  string image_url = 5;
  string image_sha256 = 6;
  string cloud_init_user_data = 7;
  string image_path = 8;
  string image_format = 9;
  repeated string ssh_key_names = 10;
  StorageBackendType storage_backend = 11;
  int64 storage_size_bytes = 12;
}

message CreateWorkloadResponse {
  WorkloadKind kind = 1;
  string workload_id = 2;
  string node_id = 3;
  VmState vm_state = 4;
  ContainerState container_state = 5;
  ApplyAction action = 6;              // upsert outcome: created|updated|unchanged
  repeated string changed_fields = 7;  // names of mutated fields when action == UPDATED
}

message DeleteWorkloadRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
  string target_node = 3;
}

message DeleteWorkloadResponse {
  bool success = 1;
}

message SetWorkloadDesiredStateRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
  WorkloadDesiredState desired_state = 3;
  string target_node = 4;
}

message SetWorkloadDesiredStateResponse {
  WorkloadKind kind = 1;
  VmState vm_state = 2;
  ContainerState container_state = 3;
}

message GetWorkloadRequest {
  WorkloadKind kind = 1;
  string workload_id = 2;
  string target_node = 3;
}

message GetWorkloadResponse {
  WorkloadKind kind = 1;
  VmSpec vm_spec = 2;
  ContainerSpec container_spec = 3;
  VmStatus vm_status = 4;
  ContainerInfo container_info = 5;
  string node_id = 6;
  string assigned_ip = 7;
}

message ListWorkloadsRequest {
  WorkloadKind kind = 1; // optional filter
  string target_node = 2;
}

message ListWorkloadsResponse {
  repeated VmInfo vms = 1;
  repeated ContainerInfo containers = 2;
}

message CreateNetworkRequest {
  string name = 1;
  string external_ip = 2;
  string gateway_ip = 3;
  string internal_netmask = 4;
  string target_node = 5;  // Optional - controller picks if empty
  repeated int32 allowed_tcp_ports = 6;  // TCP ports to DNAT-forward from external IP
  repeated int32 allowed_udp_ports = 7;  // UDP ports to DNAT-forward from external IP
  int32 vlan_id = 8;  // Optional VLAN tag (0 = no VLAN, bridges directly on gatewayInterface)
  string network_type = 9;  // "nat" (default), "bridge", or "vxlan"
  bool enable_outbound_nat = 10;  // For vxlan: whether VMs can reach the internet (default true)
  string ipv6_prefix = 11;        // Optional /64. Empty leaves the network IPv4-only.
  string ipv6_gateway = 12;       // Must be prefix::1 when ipv6_prefix is set.
  bool east_west_firewall = 13;   // Drop VM-to-VM traffic on this bridge unless a security-group rule allows it.
}

message CreateNetworkResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
  ApplyAction action = 4;              // upsert outcome: created|unchanged (all fields immutable in v1)
  repeated string changed_fields = 5;  // unused in v1; reserved for future mutable fields
}

message DeleteNetworkRequest {
  string name = 1;
  string target_node = 2;  // Optional - controller resolves by name if unique
}

message DeleteNetworkResponse {
  bool success = 1;
}

message ListNetworksRequest {
  string target_node = 1;  // Optional
}

message ListNetworksResponse {
  repeated NetworkInfo networks = 1;
}

message NetworkInfo {
  string name = 1;
  string external_ip = 2;
  string gateway_ip = 3;
  string internal_netmask = 4;
  string node_id = 5;
  repeated int32 allowed_tcp_ports = 6;
  repeated int32 allowed_udp_ports = 7;
  int32 vlan_id = 8;
  string network_type = 9;  // "nat", "bridge", or "vxlan"
  bool enable_outbound_nat = 10;
  string ipv6_prefix = 11;
  string ipv6_gateway = 12;
  bool east_west_firewall = 13;
}

// A single PostgreSQL database realized by the NixOS services.postgresql module
// (pkgs.postgresql or a pinned major). v1 allows one instance per node and
// does not open TCP; clients use the local Unix socket.
message PostgresqlInfo {
  string name = 1;
  string database = 2;
  string package = 3;
  int32 port = 4;
  string node_id = 5;
}

message CreatePostgresqlRequest {
  string name = 1;
  string database = 2;  // empty uses name when name is a PostgreSQL identifier
  string package = 3;   // empty selects pkgs.postgresql
  int32 port = 4;       // 0 selects 5432
  string target_node = 5;
}

message CreatePostgresqlResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
  ApplyAction action = 4;
  repeated string changed_fields = 5;
  PostgresqlInfo postgresql = 6;
}

message DeletePostgresqlRequest {
  string name = 1;
}

message DeletePostgresqlResponse {
  bool success = 1;
  string message = 2;
}

message GetPostgresqlRequest {
  string name = 1;
}

message GetPostgresqlResponse {
  PostgresqlInfo postgresql = 1;
}

message ListPostgresqlsRequest {
  string target_node = 1;
}

message ListPostgresqlsResponse {
  repeated PostgresqlInfo postgresqls = 1;
}

enum SecurityGroupTargetKind {
  SECURITY_GROUP_TARGET_KIND_UNSPECIFIED = 0;
  SECURITY_GROUP_TARGET_KIND_VM = 1;
  SECURITY_GROUP_TARGET_KIND_NETWORK = 2;
}

message SecurityGroupRule {
  string id = 1;
  string protocol = 2; // tcp|udp
  int32 host_port = 3;
  int32 target_port = 4; // defaults to host_port when unset
  string source_cidr = 5; // optional, defaults to 0.0.0.0/0
