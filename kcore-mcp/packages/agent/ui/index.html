<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kcore agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">kcore agent</div>
      <button id="new-session" class="primary">New session</button>
      <ul id="session-list"></ul>
      <div id="cluster" class="cluster"></div>
    </aside>
    <main>
      <header>
        <div id="session-title" class="title"></div>
        <div class="pickers">
          <select id="provider" title="Provider"></select>
          <select id="model" title="Model"></select>
          <button id="open-settings">Providers</button>
        </div>
      </header>
      <section id="transcript" aria-live="polite"></section>
      <footer>
        <div id="notice" class="notice" hidden></div>
        <form id="composer">
          <textarea id="input" rows="2" placeholder="Ask kcore to create or change something"></textarea>
          <div class="composer-buttons">
            <button id="cancel" type="button" hidden>Stop</button>
            <button id="send" type="submit" class="primary">Send</button>
          </div>
        </form>
      </footer>
    </main>
    <dialog id="settings">
      <h2>Providers</h2>
      <p class="muted">Keys are kept by the agent in <code>~/.kcore/agent/auth.json</code> and never sent back to the browser.</p>
      <div id="provider-rows"></div>
      <div class="dialog-buttons"><button id="close-settings">Close</button></div>
    </dialog>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
