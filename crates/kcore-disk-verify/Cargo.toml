[package]
name = "kcore-disk-verify"
version = "0.3.0"
edition = "2021"
description = "Write-verify check that proves a disk keeps data across a power cycle"

# Source of truth is kcore-provisioning/crates/kcore-disk-verify; this copy
# ships the tool in the installer / netboot image.

[lib]
name = "kcore_disk_verify"
path = "src/lib.rs"

[[bin]]
name = "kcore-disk-verify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
