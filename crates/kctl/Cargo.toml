[package]
name = "kctl"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
kcore-gpu = { path = "../kcore-gpu" }
kcore-sanitize = { path = "../kcore-sanitize" }
kcore-disk-layout-yaml = { path = "../kcore-disk-layout-yaml" }
dirs = "6"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "sync", "process", "signal", "time", "net"] }
tonic = { version = "0.12", features = ["tls", "transport"] }
anyhow = "1.0.102"
tokio-stream = "0.1"
base64 = "0.22.1"
x509-parser = { version = "0.18.1", features = ["verify"] }
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
prost-reflect = { version = "0.14", features = ["serde"] }
futures-util = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
sha2 = "0.10"
jsonwebtoken = "9"

[target.'cfg(target_os = "macos")'.dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
aws-lc-rs = "1.16.2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
tonic-health = "0.12"
tokio-stream = { version = "0.1", features = ["net"] }
proptest = "1.11"

[build-dependencies]
tonic-build = "0.12"

[lints]
workspace = true
