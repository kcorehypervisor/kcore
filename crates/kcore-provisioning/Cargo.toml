[package]
name = "kcore-provisioning"
version = "0.5.0"
edition = "2021"
description = "Multi-network PowerDNS and Kea provisioner"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"

[lints]
workspace = true
