[package]
name = "kcore-node-agent"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
kcore-sanitize = { path = "../kcore-sanitize" }
kcore-disko-types = { path = "../kcore-disko-types" }
hostname = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http-body-util = "0.1"
hyperlocal = "0.9"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
tonic-health = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pem = "3"
aws-lc-rs = "1.16.2"
const-oid = { version = "0.9.5", features = ["db"] }
der = { version = "0.7.8", features = ["alloc", "oid"] }
spki = { version = "0.7.2", features = ["alloc"] }
x509-cert = "0.2.5"
x509-ocsp = { version = "0.2.1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
time = "0.3"
# verify-aws: CRL and OCSP signature verification through aws-lc-rs, not ring.
x509-parser = { version = "0.18", features = ["verify-aws"] }
anyhow = "1.0.102"
libc = "0.2"
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
