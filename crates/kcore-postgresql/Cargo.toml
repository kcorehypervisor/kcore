[package]
name = "kcore-postgresql"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL cluster spec, rollout planner, Nix fragment renderer, Patroni and SQL helpers."

[dependencies]
kcore-sanitize = { path = "../kcore-sanitize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
