\* Bounded safety check. The nextId constraint keeps registration finite.
\* Deadlock at that bound is the end of the trace, so TLC is invoked with -deadlock.
SPECIFICATION Spec

CONSTANTS
    MaxTasks = 3
    MaxRetries = 2

CONSTRAINT StateConstraint

INVARIANT TypeInvariant
INVARIANT ExecutedTasksAreTerminal
INVARIANT PendingTasksNotCompleted
INVARIANT RetryBound
INVARIANT FailedTasksExhaustedRetries
INVARIANT NoDuplicatesInQueue
