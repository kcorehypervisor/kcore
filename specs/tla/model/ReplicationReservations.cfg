\* Bounded safety check. Priority and capacity are capped so TLC finishes
\* in seconds; the implementation still accepts priorities 1..10.
\* Invoke TLC with -deadlock: creating another reservation past the id
\* bound is pruned by the constraint.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    v1 = v1
    Replicas = {r1, r2}
    Volumes = {v1}
    MaxCapacity = 2
    MaxReservations = 2
    MaxPriority = 2

CONSTRAINT StateConstraint

INVARIANT TypeInvariant
INVARIANT CapacityNotExceeded
INVARIANT UniqueReservationIds
INVARIANT DistinctSourceAndTarget
INVARIANT PositiveReservationSize
INVARIANT ValidPriorities
INVARIANT NoDuplicateVolumeReservations
INVARIANT NonNegativeAllocations
