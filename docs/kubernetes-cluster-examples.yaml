## Validation Checklist

Before applying any spec:

- [ ] Node IDs exist in `kctl get nodes`
- [ ] All nodes are approved
- [ ] Advertise addresses are correct and static
- [ ] Interfaces exist on all nodes
- [ ] VIP is not already in use
- [ ] Pod CIDR doesn't overlap management (192.168.40.x)
- [ ] Pod CIDR doesn't overlap Ceph (192.168.47.x)
- [ ] Service CIDR doesn't overlap Pod CIDR
- [ ] Control plane count is odd (1, 3, 5, 7)
- [ ] LoadBalancer IPs reserved outside DHCP range
- [ ] All nodes have sufficient resources (CPU, RAM, disk)
- [ ] Cilium requires kernel 4.19.57+ (check with `uname -r`)

