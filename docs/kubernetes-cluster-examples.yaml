## Scaling Example

Start small, scale up:

**Initial (3 control planes + 3 workers):**
```yaml
  controlPlane:
    nodes:
      - nodeId: node-105
        advertiseAddress: 192.168.40.105
        iface: enp6s0
        initialCluster: true
      
      - nodeId: node-107
        advertiseAddress: 192.168.40.107
        iface: enp6s0
        joinExisting: true
      
      - nodeId: node-119
        advertiseAddress: 192.168.40.119
        iface: enp6s0
        joinExisting: true
  
  workers:
    nodes:
      - nodeId: node-103
        advertiseAddress: 192.168.40.103
        iface: enp6s0
      
      - nodeId: worker-2
        advertiseAddress: 192.168.40.104
        iface: enp6s0
      
      - nodeId: worker-3
        advertiseAddress: 192.168.40.106
        iface: enp6s0
```

**After scaling (add 2 workers):**
```yaml
  workers:
    nodes:
      - nodeId: node-103
        advertiseAddress: 192.168.40.103
        iface: enp6s0
      
      - nodeId: worker-2
        advertiseAddress: 192.168.40.104
        iface: enp6s0
      
      - nodeId: worker-3
        advertiseAddress: 192.168.40.106
        iface: enp6s0
      
      - nodeId: worker-4  # NEW
        advertiseAddress: 192.168.40.108
        iface: enp6s0
      
      - nodeId: worker-5  # NEW
        advertiseAddress: 192.168.40.109
        iface: enp6s0
```

Then:
```bash
kctl kubernetes plan -f updated-cluster.yaml
kctl kubernetes apply -f updated-cluster.yaml
```

