## Multi-NIC Cluster (Separate Management/Data Networks)

For clusters with dedicated data plane network.

```yaml
kind: KubernetesCluster
metadata:
  name: multi-nic
  generation: 1
spec:
  clusterCidr: 10.244.0.0/16
  serviceCidr: 10.96.0.0/12
  clusterDns: 10.96.0.10
  apiServerEndpoint: 192.168.40.200:6443
  
  cni: cilium
  ciliumConfig:
    mode: native-routing
    mtu: 9000  # Jumbo frames on 10G data network
    ipam: kubernetes
    tunnel: disabled
    autoDirectNodeRoutes: true
    
    hubble:
      enabled: true
    
    loadBalancer:
      mode: l2
      ipPools:
        - name: default-pool
          cidr: 192.168.40.220/29
      l2Announcements:
        - interface: enp7s0  # 10G data NIC
  
  controlPlane:
    nodes:
      - nodeId: node-105
        advertiseAddress: 192.168.40.105
        iface: enp7s0  # Use 10G data NIC for pod traffic
        initialCluster: true
      
      - nodeId: node-107
        advertiseAddress: 192.168.40.107
        iface: enp7s0
        joinExisting: true
      
      - nodeId: node-119
        advertiseAddress: 192.168.40.119
        iface: enp7s0
        joinExisting: true
  
  workers:
    nodes:
      - nodeId: node-103
        advertiseAddress: 192.168.40.103
        iface: enp7s0
      
      - nodeId: worker-2
        advertiseAddress: 192.168.40.104
        iface: enp7s0
      
      - nodeId: worker-3
        advertiseAddress: 192.168.40.106
        iface: enp7s0
  
  highAvailability:
    enabled: true
    vipAddress: 192.168.40.200
    vipInterface: enp7s0
    method: keepalived
```

**Use Case:**
- Separate 1G management (kcore control) from 10G data (Kubernetes)
- Jumbo frames (MTU 9000) for better performance
- Isolate Kubernetes traffic from VM traffic

