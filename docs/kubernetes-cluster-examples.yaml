## CIDR Planning

### Avoid Overlaps

| Network Type | Default | Alternatives |
|--------------|---------|--------------|
| Pod CIDR | 10.244.0.0/16 | 10.240.0.0/16, 172.16.0.0/16 |
| Service CIDR | 10.96.0.0/12 | 10.32.0.0/12, 172.20.0.0/16 |
| Management | 192.168.40.0/24 | (existing, don't change) |
| Ceph | 192.168.47.0/24 | (existing, don't change) |
| LoadBalancer | 192.168.40.220/29 | (reserve IPs outside DHCP) |

### Capacity

| CIDR | Max Addresses | Use Case |
|------|---------------|----------|
| /16 | 65,536 | Large clusters (thousands of pods) |
| /20 | 4,096 | Medium clusters (hundreds of pods) |
| /24 | 256 | Small dev clusters |

