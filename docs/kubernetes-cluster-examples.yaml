  controlPlane:
    nodes:
      - nodeId: cp-1
        advertiseAddress: 192.168.40.101
        iface: enp6s0
        initialCluster: true
      
      - nodeId: cp-2
        advertiseAddress: 192.168.40.102
        iface: enp6s0
        joinExisting: true
      
      - nodeId: cp-3
        advertiseAddress: 192.168.40.103
        iface: enp6s0
        joinExisting: true
      
      - nodeId: cp-4
        advertiseAddress: 192.168.40.104
        iface: enp6s0
        joinExisting: true
      
      - nodeId: cp-5
        advertiseAddress: 192.168.40.105
        iface: enp6s0
        joinExisting: true
  
  workers:
    nodes:
      - nodeId: worker-1
        advertiseAddress: 192.168.40.111
        iface: enp6s0
      
      - nodeId: worker-2
        advertiseAddress: 192.168.40.112
        iface: enp6s0
      
      - nodeId: worker-3
        advertiseAddress: 192.168.40.113
        iface: enp6s0
      
      - nodeId: worker-4
        advertiseAddress: 192.168.40.114
        iface: enp6s0
      
      - nodeId: worker-5
        advertiseAddress: 192.168.40.115
        iface: enp6s0
      
      - nodeId: worker-6
        advertiseAddress: 192.168.40.116
        iface: enp6s0
      
      - nodeId: worker-7
        advertiseAddress: 192.168.40.117
        iface: enp6s0
      
      - nodeId: worker-8
        advertiseAddress: 192.168.40.118
        iface: enp6s0
      
      - nodeId: worker-9
        advertiseAddress: 192.168.40.119
        iface: enp6s0
      
      - nodeId: worker-10
        advertiseAddress: 192.168.40.120
        iface: enp6s0
  
  highAvailability:
    enabled: true
    vipAddress: 192.168.40.200
    vipInterface: enp6s0
    method: keepalived
```

**Features:**
- 5 control planes = tolerates 2 failures (etcd quorum = 3/5)
- 10 workers = high workload capacity
- Larger LoadBalancer IP pool (16 IPs)
- Better load distribution

**Note:** etcd odd numbers only (3, 5, 7). Don't use 4 or 6 control planes.

