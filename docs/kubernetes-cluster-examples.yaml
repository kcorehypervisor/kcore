## Large Cluster (5 Control Planes + 10 Workers)

For very large deployments requiring maximum availability.

```yaml
kind: KubernetesCluster
metadata:
  name: production-large
  generation: 1
spec:
  clusterCidr: 10.244.0.0/16
  serviceCidr: 10.96.0.0/12
  clusterDns: 10.96.0.10
  apiServerEndpoint: 192.168.40.200:6443
  
  cni: cilium
  ciliumConfig:
    mode: native-routing
    mtu: 1500
    ipam: kubernetes
    tunnel: disabled
    autoDirectNodeRoutes: true
    
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    
    loadBalancer:
      mode: l2
      ipPools:
