## Cilium Configuration Reference

### Native Routing (Default, Recommended)

```yaml
ciliumConfig:
  mode: native-routing
  mtu: 1500
  ipam: kubernetes
  tunnel: disabled
  autoDirectNodeRoutes: true
```

**Benefits:** No encapsulation, full MTU, best performance

### Tunnel Mode (VXLAN Fallback)

```yaml
ciliumConfig:
  mode: tunnel
  tunnel: vxlan
  mtu: 1450
  ipam: kubernetes
```

**Use only if:** Native routing blocked by network policy

### LoadBalancer IP Pools

```yaml
ciliumConfig:
  loadBalancer:
    mode: l2
    ipPools:
      - name: default-pool
        cidr: 192.168.40.220/29  # 8 IPs
      - name: high-priority
        cidr: 192.168.40.230/30  # 4 IPs
        serviceSelector:
          matchLabels:
            priority: high
    l2Announcements:
      - interface: enp6s0
```

### Hubble Observability

```yaml
ciliumConfig:
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - icmp
        - http
```

