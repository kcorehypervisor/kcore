# Sample Kubernetes Cluster Specifications (Cilium-Native)

## Production HA Cluster (3 Control Planes + 3 Workers)

Recommended for production. Full high availability with Cilium eBPF networking.

```yaml
kind: KubernetesCluster
metadata:
  name: lab-ha
  generation: 1
spec:
  clusterCidr: 10.244.0.0/16
  serviceCidr: 10.96.0.0/12
  clusterDns: 10.96.0.10
  apiServerEndpoint: 192.168.40.200:6443
  
  cni: cilium
  ciliumConfig:
    mode: native-routing  # Direct routing, no tunnels
    mtu: 1500             # Full MTU
    ipam: kubernetes
    tunnel: disabled
    autoDirectNodeRoutes: true
    
    # Hubble observability
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    
    # Cilium LoadBalancer L2
    loadBalancer:
      mode: l2
      ipPools:
        - name: default-pool
          cidr: 192.168.40.220/29  # 8 IPs (.220-.227)
      l2Announcements:
        - interface: enp6s0
  
  controlPlane:
    nodes:
      - nodeId: node-105
        advertiseAddress: 192.168.40.105
        iface: enp6s0
        initialCluster: true
      
      - nodeId: node-107
        advertiseAddress: 192.168.40.107
        iface: enp6s0
        joinExisting: true
      
      - nodeId: node-119
        advertiseAddress: 192.168.40.119
        iface: enp6s0
        joinExisting: true
  
  workers:
    nodes:
      - nodeId: node-103
        advertiseAddress: 192.168.40.103
        iface: enp6s0
      
      - nodeId: worker-2
        advertiseAddress: 192.168.40.104
        iface: enp6s0
      
      - nodeId: worker-3
        advertiseAddress: 192.168.40.106
        iface: enp6s0
  
  highAvailability:
    enabled: true
    vipAddress: 192.168.40.200
    vipInterface: enp6s0
    method: keepalived
```

**Features:**
- 3 control planes = tolerates 1 control plane failure
- 3 etcd members = tolerates 1 etcd failure
- VIP failover = API always reachable
- Cilium eBPF = 10x faster than iptables
- Native routing = no encapsulation overhead
- Hubble = deep network observability
- LoadBalancer IPs from 192.168.40.220-227

