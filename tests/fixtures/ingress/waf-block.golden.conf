Include @coraza.conf-recommended
Include @crs-setup.conf.example
SecAction "id:900000,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=1"
SecAction "id:900110,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
SecAction "id:900200,phase:1,pass,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
SecAction "id:900220,phase:1,pass,nolog,setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data|'"
SecRule REMOTE_ADDR "@ipMatch 192.0.2.0/24" "id:110000,phase:1,deny,status:403,log,msg:'ip denied'"
Include @owasp_crs/*.conf
SecRequestBodyLimit 1048576
SecResponseBodyAccess Off
SecRuleEngine On
SecAuditEngine RelevantOnly
SecAuditLogFormat JSON
SecAuditLogParts ABCFHZ
SecAuditLog /var/log/kcore/ingress/waf.jsonl
SecRule REQUEST_URI "@beginsWith /api/search" "id:1142100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:q"
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto" "id:10001,phase:1,deny,status:403,log,msg:'scanner'"
