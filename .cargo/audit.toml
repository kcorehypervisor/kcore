# cargo-audit config for the workspace.
# libsqlite3-sys is pinned by rusqlite 0.32 (controller + provisioning).
# The fix is rusqlite >= a release that depends on libsqlite3-sys >= 0.39;
# that bump is a separate change. Ignore until then so rust-checks can pass.
[advisories]
ignore = ["RUSTSEC-2026-0459"]
