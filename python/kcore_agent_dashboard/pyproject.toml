[project]
name = "kcore-agent-dashboard"
version = "0.1.0"
description = "One-page kcore operator console as a FastMCP app"
requires-python = ">=3.11"
dependencies = [
    "fastmcp[apps]==4.1.4",
    "prefab-ui==0.21.1",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kcore-agent-dashboard = "kcore_agent_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kcore_agent_dashboard"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
